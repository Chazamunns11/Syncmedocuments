# Value betting bot configuration.
# Secrets (API keys, Betfair/Pinnacle logins) come from environment variables,
# NOT here. See .env.example.

# === pipeline mode ===
# pinnacle_betfair : value Betfair Exchange prices against Pinnacle (truth) and
#                    place on Betfair. Recommended if you're limited on soft books.
# multi_book       : classic cross-bookmaker value scan from a single odds feed.
mode: pinnacle_betfair

# === source of truth (fair probability model) ===
# weighted : weighted Power-Method consensus across sharp + soft books
#            (practitioner method, validated; most accurate default)
# pinnacle : single sharp book (Pinnacle), de-vigged
# consensus: Kaunitz et al. -> 1/mean(odds) - alpha  (bias corrected)
# blend    : average of pinnacle and weighted estimates
truth_model: weighted
book_weights:                  # weight sharp books higher in the consensus
  pinnacle: 3.0
  _default: 1.0
consensus_min_books: 3         # min bookmakers required to form a consensus
consensus_alpha: 0.05          # Kaunitz bias term (used by truth_model: consensus)

pinnacle_source: sample        # sample | the_odds_api | direct
                               # also selects the data feed for weighted/consensus
pinnacle_sports:
  - soccer_epl                 # odds-api sport key (the_odds_api/sample);
                               # use "soccer" etc. for pinnacle_source: direct
devig_method: power            # power | shin | multiplicative | additive
                               # power/shin correct favourite-longshot bias best

# === betting venue: Betfair Exchange ===
venue_source: sample           # sample | betfair
betfair_event_type: soccer     # soccer | tennis | basketball | ... (see code)
betfair_competition_ids: []    # optional Betfair competition id filter
betfair_commission: 0.05       # commission on net winnings (UK base rate 5%)
betfair_market_start_within_hours: 72

# === event matching (pinnacle <-> betfair) ===
match_min_team_score: 0.6      # min team-name similarity to pair an event
match_start_window_minutes: 90 # max kickoff-time difference to pair an event

# === value detection ===
reference_books:
  - pinnacle
min_edge: 0.02                 # require >= 2% overlay AFTER commission + haircut
min_price: 1.30
max_price: 15.0
edge_haircut: 0.01             # subtract from edge for estimation error/slippage
min_liquidity: 10.0            # min money (in stake currency) available to back
max_overround: 1.15            # skip Pinnacle markets wider than this booksum
min_expected_clv: 0.0          # only bet when expected CLV exceeds this (>0 = +CLV)
one_bet_per_event: true        # never place more than one bet on a single event

# === continuous / near-kickoff scheduling (used by `run.py watch`) ===
poll_interval_seconds: 60      # cadence when nothing is near kickoff
refresh_interval_seconds: 5    # cadence when an event is inside its place window
place_window_minutes: 3        # start placing this long before kickoff (sharp line)
min_seconds_before_start: 20   # stop placing this close to kickoff (avoid in-play)

# === staking / bankroll ===
bankroll: 1000.0               # your budget / starting bank
kelly_multiplier: 0.20         # 15-20% Kelly is the practitioner range
flat_stake:                    # set a number for a FIXED stake per bet (overrides Kelly)
max_fraction_per_bet: 0.02
min_stake: 1.0
max_stake: 100.0               # bet size cap
max_total_exposure_fraction: 0.10

# === execution ===
executor: betfair              # betfair | paper. Falls back to paper unless live.
live: false                    # MUST be true to place real bets on Betfair
betfair_dry_run: true          # resolve markets but don't send live orders
paper_slippage: 0.0
paper_fill_probability: 1.0

# === multi_book mode only ===
provider: sample               # sample | the_odds_api
regions: uk,eu
sports:
  - soccer_epl
markets:
  - h2h

# === storage ===
db_path: bets.db
csv_path: bets.csv
